body.adm{--ed:#D95E82;--ed-soft:#FDECF1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#EEF2F7;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
.ar{font-family:Cairo,"Geeza Pro","Noto Naskh Arabic",sans-serif;direction:rtl;unicode-bidi:isolate}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 40px rgba(14,32,61,.08);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--navy2) 0%,var(--navy) 62%,#1B4470 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px 0;}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--teal) 0%,#5BC0C6 45%,var(--pink) 100%)}
.bh{width:92px;height:48px;flex:none;background:#fff var(--logoB) center/70px auto no-repeat;border-radius:0 16px 16px 0}
.hdr .tt{flex:1;min-width:0}
.hdr .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7FDCDC;font-weight:700}
.hdr .h{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nok{width:46px;height:22px;background:var(--logoN) center/contain no-repeat;flex:none}
.back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer;flex:none}
/* hero */
.hero{background:linear-gradient(160deg,var(--navy2),var(--navy) 70%);color:#fff;padding:22px 18px 20px;position:relative}
.hero .d{display:inline-block;background:var(--teal);color:#fff;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:700;letter-spacing:.08em}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.1;margin:12px 0 4px;font-weight:700}
.hero .ar{color:#A9E4E4;font-size:16px}
.hero p{color:#C9D6E8;font-size:14px;margin:10px 0 0}
.wrap{padding:16px}
/* edition toggle */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ed);box-shadow:0 1px 4px rgba(14,32,61,.12)}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:18px 0 8px}
.name{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px}
.prog{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink));border-radius:8px;transition:width .3s}
/* module group */
.mod{margin-top:18px}
.modh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.modh b{font-size:13px;color:#fff;background:var(--navy);border-radius:8px;padding:2px 8px}
.modh span{font-weight:700;font-size:15px}
.modh small{color:var(--muted);font-size:12px;margin-left:auto}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.act:active{transform:scale(.99)}
.num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.act.done .num{background:var(--good)}
.act .t{flex:1;min-width:0}
.act .t b{display:block;font-size:15px;font-weight:600}
.act .t small{color:var(--muted);font-size:12.5px}
.act .chev{color:var(--muted);font-size:18px}
/* activity page */
.ahead{padding:18px 16px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal2)}
.chip .min{background:var(--navy);color:#fff;border-radius:20px;padding:1px 8px;letter-spacing:.06em}
.ahead h2{font-size:24px;line-height:1.15;margin:8px 0 2px;letter-spacing:-.01em}
.ahead .ar{color:var(--teal2);font-size:15px}
.card{border-radius:16px;padding:14px 15px;margin:12px 16px}
.why{background:var(--amber-soft);border:1px solid #F2D9A8}
.why b{color:#9A6410;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:3px}
.how{background:var(--violet-soft);border:1px solid #D9D9F5}
.how b.l{color:var(--violet);font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;display:flex;gap:10px;margin:7px 0;font-size:15px}
.how li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--violet);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tool{background:var(--teal-soft);border:1px solid #BFE6E8}
.tool b.l{color:var(--teal2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:8px}
.letters{display:grid;gap:8px}
.lt{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:9px 11px}
.lt .L{width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.lt div{font-size:14px}
.lt em{color:var(--muted);font-style:normal;display:block;font-size:13.5px}
.ex{background:#fff;border-left:4px solid var(--ed);border-radius:10px;padding:10px 12px;font-size:14.5px;font-style:italic}
.fld{margin:14px 16px}
.fld label{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.fld label i{font-style:normal;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:0}
textarea{width:100%;min-height:84px;border:1.5px dashed #B9C6D6;border-radius:12px;padding:11px 12px;background:#FAFCFE;font-size:16px;resize:vertical;line-height:1.4}
textarea:focus,.name:focus{outline:none;border-color:var(--teal);border-style:solid;background:#fff}
.checks{margin:12px 16px}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
.ck .bx{width:24px;height:24px;border-radius:7px;border:2px solid #B9C6D6;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.ck.on{border-color:var(--good);background:var(--good-soft)}
.ck.on .bx{background:var(--good);border-color:var(--good)}
.ck.on .bx::after{content:"✓"}
.hint{font-size:13px;color:var(--muted);margin:4px 16px 0}
/* cards reveal */
.qa{display:grid;gap:8px;margin:12px 16px}
.qac{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer;width:100%}
.qac b{display:block;font-size:15px}
.qac span{display:none;color:var(--teal2);font-size:14.5px;margin-top:6px}
.qac small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:block;margin-top:6px}
.qac.show{border-color:var(--teal);background:var(--teal-soft)}
.qac.show span{display:block}.qac.show small{display:none}
/* scale */
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 16px 8px}
.sc .q{font-size:14.5px;font-weight:500;margin-bottom:8px;display:flex;gap:8px}
.sc .q b{color:var(--muted);font-weight:700;min-width:18px}
.sc.low{border-color:var(--pink);background:var(--pink-soft)}
.dots{display:flex;gap:6px}
.dots button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:15px;color:var(--muted)}
.dots button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.scale-k{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:0 18px 6px}
/* bank */
.bank{margin:12px 16px;display:grid;gap:12px}
.bk h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:15px}
.bk h4 .L{width:26px;height:26px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.star{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer;font-size:15px}
.star .s{font-size:18px;color:#C3CDD9;flex:none}
.star.on{border-color:var(--amber);background:var(--amber-soft)}
.star.on .s{color:var(--amber)}
/* quiz */
.qz{margin:12px 16px;display:grid;gap:12px}
.qq{background:var(--soft);border-radius:16px;padding:13px}
.qq h4{margin:0 0 8px;font-size:15px;display:flex;gap:8px}
.qq h4 i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:6px;cursor:pointer;font-size:15px}
.opt.ok{border-color:var(--good);background:var(--good-soft);font-weight:600}
.opt.no{border-color:var(--pink2);background:var(--pink-soft);text-decoration:line-through;color:var(--muted)}
.qq .exp{display:none;font-size:13.5px;color:var(--teal2);margin-top:4px}
.qq.answered .exp{display:block}
.score{text-align:center;font-weight:700;font-size:18px;margin:6px 16px 0;color:var(--navy)}
/* heat result */
.result{background:var(--pink-soft);border:1px solid #F6C6D3}
.result b.l{color:var(--pink2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}
.pill{display:inline-block;background:#fff;border:1px solid #F6C6D3;color:var(--pink2);border-radius:20px;padding:3px 10px;font-weight:600;font-size:13.5px;margin:2px 4px 2px 0}
/* case */
.case{background:linear-gradient(160deg,#fff,var(--ed-soft));border:1px solid var(--line)}
.case .quote{font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.25;margin:8px 0 10px;color:var(--navy)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.facts div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:13.5px;font-weight:500}
.toggle{background:none;border:0;color:var(--teal2);font-weight:700;padding:0;margin:4px 16px;cursor:pointer;font-size:14px}
.hidebox{display:none}.hidebox.on{display:block}
/* roles */
.roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px 16px}
.role{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.role .n{font-weight:800;font-size:18px;color:var(--navy)}
.role b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal2);margin:2px 0}
.role small{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.tabs{display:flex;gap:6px;margin:14px 16px 6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* timer */
.tmr{display:flex;align-items:center;gap:10px;margin:12px 16px}
.tmr button{border:0;background:var(--amber);color:#3B2600;font-weight:700;border-radius:24px;padding:9px 16px;cursor:pointer;font-size:14px}
.tmr span{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--navy)}
.tmr span.end{color:var(--pink2)}
/* preview */
.preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;white-space:pre-wrap;margin-top:8px;min-height:44px}
/* buttons */
.btns{display:flex;gap:8px;margin:18px 16px 4px}
.btn{flex:1;border:0;border-radius:14px;padding:14px 10px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--teal);color:#fff}
.btn.sec{background:var(--soft);color:var(--navy);border:1px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff}
.btn.done{background:var(--good);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:560px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--navy)}
.nav button.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.plan h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal2);margin:18px 16px 6px}
.plan .pb{margin:0 16px;background:var(--soft);border-radius:12px;padding:11px 13px;font-size:14.5px;white-space:pre-wrap}
.plan .empty{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:24px 16px 8px}
.edtag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--ed-soft);color:var(--ed)}
</style>

    h+='<div class="mod"><div class="modh"><b>'+m[0].split(' ·')[0]+'</b><span>'+m[1]+'</span><small>'+m[2]+'</small></div>';
    list.forEach(function(a){var n=ACTS.indexOf(a)+1;
      h+='<button class="act'+(isDone(a)?' done':'')+'" data-go="'+a.id+'"><span class="num">'+(isDone(a)?'✓':n)+'</span><span class="t"><b>'+esc(a.title)+'</b><small>Activity '+n+' · '+a.min+' min · slide '+a.slide+'</small></span><span class="chev">›</span></button>'});
    h+='</div>'});
  h+='<div class="foot">Baheya × NOK Learning Hub · Leadership & Team Management</div></div>';
  app.innerHTML=h;
  nav.innerHTML='<div class="in"><button class="p" data-go="plan">★ My plan · share</button></div>';
  var nm=document.getElementById('nm');nm.addEventListener('input',function(){store.set('name',nm.value)});
}

/* ---------- activity ---------- */
function fieldHTML(f){return '<div class="fld"><label><i>'+esc(f[1])+'</i>'+esc(f[2])+'</label><textarea data-k="'+f[0]+'" placeholder="'+esc(f[3])+'">'+esc(store.get(f[0])||'')+'</textarea></div>'}
function checkHTML(c){return '<button class="ck'+(store.get(c[0])==='1'?' on':'')+'" data-ck="'+c[0]+'"><span class="bx"></span><span>'+esc(c[1])+'</span></button>'}
function activity(a){
  var n=ACTS.indexOf(a)+1;
  var h=header('Activity '+n+' of '+ACTS.length,esc(a.title),true);
  h+='<div class="ahead"><div class="chip">'+esc(a.mod)+' <span class="min">'+a.min+' min</span> <span class="edtag">'+(ED==='adm'?'Admin':'Medical')+'</span></div><h2>'+esc(a.title)+'</h2><div class="ar">'+a.ar+'</div></div>';
  h+='<div class="card why"><b>Why we do this</b>'+esc(a.why)+'</div>';
  h+='<div class="card how"><b class="l">How · '+a.min+' min</b><ol>'+a.how.map(function(x){return '<li><span>'+esc(t(x))+'</span></li>'}).join('')+'</ol></div>';
  if(a.tip)h+='<div class="hint">💡 '+esc(a.tip)+'</div>';
  if(a.tool){h+='<div class="card tool"><b class="l">'+esc(a.tool.label)+'</b>';
    if(a.tool.letters)h+='<div class="letters">'+a.tool.letters.map(function(l){return '<div class="lt"><span class="L">'+l[0]+'</span><div><b>'+esc(l[1])+'</b><em>'+esc(l[2])+'</em></div></div>'}).join('')+'</div>';
    if(a.tool.ex)h+='<div class="ex" style="margin-top:'+(a.tool.letters?'10px':'0')+'">'+esc(t(a.tool.ex))+'</div>';
    h+='</div>'}
  if(a.cards)h+='<div class="qa">'+a.cards.map(function(c,i){return '<button class="qac" data-rv="'+i+'"><b>'+esc(c[0])+'</b><small>Tap to reveal</small><span>'+esc(c[1])+'</span></button>'}).join('')+'</div>';
  if(a.kase){h+='<div class="card case"><span class="chip">'+(ED==='adm'?'The biomedical engineering section':'A busy clinical unit')+' · fictional</span><div class="quote">'+(ED==='adm'?'“Technically strong, but tired — and the supervisor fixes everything personally.”':'“Clinically strong, but tired — and the lead solves everything personally.”')+'</div><div class="facts">'+(ED==='adm'?['Two new technicians silent','A veteran dismisses tickets','Clinics get mixed updates','Supervisor is the bottleneck']:['Two new staff silent in huddles','A veteran dismisses the tracker','Families get mixed updates','Lead is the bottleneck']).map(function(f){return '<div>'+f+'</div>'}).join('')+'</div></div>';
    h+='<button class="toggle" data-tg="tools">Need a hint? Show all the tools ›</button><div class="hidebox card tool" id="tools"><b class="l">Your toolbox</b><b>Day 1:</b> leadership styles (Direct · Coach · Support · Delegate), team stages, team norms, balanced roles, psychological safety & voice, the change talk.<br><b>Day 2:</b> performance contract, SBI, SBAR, GROW coaching, engagement heatmap, positive SBI, 30/60/90.</div>'}
  if(a.roles)h+='<div class="roles">'+a.roles.map(function(r){return '<div class="role"><div class="n">'+r[0]+'</div><b>'+r[1]+'</b><small>'+r[2]+'</small></div>'}).join('')+'</div>';
  if(a.rounds){var R=+(store.get('round')||1);
    h+='<div class="lbl" style="margin:14px 16px 0">Observer checklist</div><div class="tabs">'+[1,2,3].map(function(r){return '<button data-rd="'+r+'" class="'+(r===R?'on':'')+'">Round '+r+'</button>'}).join('')+'</div><div class="checks">'+
    [['Asked more than told'],['Listened before suggesting'],['Ended with one clear action']].map(function(c,i){return checkHTML(['ob'+R+'_'+i,c[0]])}).join('')+'</div>';
    h+='<div class="fld"><label><i>💬</i>One tip for the coach</label><textarea data-k="obtip'+R+'" placeholder="One thing that worked · one thing to try">'+esc(store.get('obtip'+R)||'')+'</textarea></div>';
    h+='<div class="tmr"><button data-tm="480">▶ 8-min round</button><span id="tm">8:00</span></div>'}
  if(a.bank)h+='<div class="bank">'+a.bank.map(function(b,bi){return '<div class="bk"><h4><span class="L">'+b[0]+'</span>'+b[1]+'</h4>'+b[2].map(function(q,qi){var k='st'+bi+qi;return '<button class="star'+(store.get(k)==='1'?' on':'')+'" data-ck="'+k+'"><span class="s">★</span><span>'+esc(q)+'</span></button>'}).join('')+'</div>'}).join('')+'</div>';
  if(a.heat){h+='<div class="scale-k"><span>1 = weak</span><span>5 = strong</span></div>';
    THEMES.forEach(function(th,i){var v=store.get('hm'+i);h+='<div class="sc" id="hm'+i+'"><div class="q"><b>'+(i+1)+'</b>'+th+'</div><div class="dots" data-sc="hm'+i+'">'+[1,2,3,4,5].map(function(d){return '<button class="'+(String(d)===v?'on':'')+'">'+d+'</button>'}).join('')+'</div></div>'});
    h+='<div class="card result" id="heatres"></div>';
    h+='<div class="fld"><label><i>7</i>My 7-day action</label><textarea data-k="ha" placeholder="What I will do in the next 7 days">'+esc(store.get('ha')||'')+'</textarea></div>'}
  if(a.conf){h+='<div class="scale-k"><span>1 = not confident</span><span>5 = very confident</span></div>';
    a.conf.forEach(function(c,i){var v=store.get('cf'+i);h+='<div class="sc"><div class="q"><b>'+(i+1)+'</b>'+esc(t(c))+'</div><div class="dots" data-sc="cf'+i+'">'+[1,2,3,4,5].map(function(d){return '<button class="'+(String(d)===v?'on':'')+'">'+d+'</button>'}).join('')+'</div></div>'})}
  if(a.quiz){h+='<div class="qz">'+a.quiz.map(function(q,qi){var ans=store.get('qz'+qi);return '<div class="qq'+(ans!=null?' answered':'')+'" data-qz="'+qi+'"><h4><i>'+(qi+1)+'</i>'+esc(q[0])+'</h4>'+q[1].map(function(o,oi){var c='';if(ans!=null){if(oi===q[2])c=' ok';else if(String(oi)===ans)c=' no'}return '<button class="opt'+c+'" data-o="'+oi+'">'+esc(o)+'</button>'}).join('')+'<div class="exp">'+esc(q[3])+'</div></div>'}).join('')+'</div><div class="score" id="qscore"></div>'}
  if(a.fields)h+=a.fields.map(fieldHTML).join('');
  if(a.preview)h+='<div class="fld"><label><i>👁</i>Read it like this</label><div class="preview" id="pv"></div></div>';
  if(a.timer15)h+='<div class="tmr"><button data-tm="15">▶ 15-second test</button><span id="tm">0:15</span><button class="cp" data-copy="pv" style="background:var(--soft);color:var(--navy);border:1px solid var(--line)">Copy</button></div>';
  if(a.checks){h+=a.checksLabel?'<div class="lbl" style="margin:16px 16px 0">'+esc(a.checksLabel)+'</div>':'';h+='<div class="checks">'+a.checks.map(checkHTML).join('')+'</div>'}
  h+='<div class="btns"><button class="btn '+(isDone(a)?'done':'pri')+'" data-done="'+a.id+'">'+(isDone(a)?'✓ Done':'Mark as done')+'</button></div>';
  h+='<div class="foot">Slide '+a.slide+' on the main screen</div>';
  app.innerHTML=h;
  var prev=ACTS[n-2],next=ACTS[n];
  nav.innerHTML='<div class="in"><button data-go="'+(prev?prev.id:'')+'">'+(prev?'‹ Prev':'‹ All')+'</button><button data-go="plan">★ My plan</button><button class="p" data-go="'+(next?next.id:'plan')+'">'+(next?'Next ›':'Finish ›')+'</button></div>';
  if(a.heat)heatResult();if(a.quiz)qscore();if(a.preview)pv(a);
}
function heatResult(){
  var vals=THEMES.map(function(_,i){var v=store.get('hm'+i);return v?+v:null});
  var rated=vals.map(function(v,i){return [v,i]}).filter(function(x){return x[0]!=null});
  var el=document.getElementById('heatres');if(!el)return;
  document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('low')});
  if(rated.length<12){el.innerHTML='<b class="l">Your two lowest</b>Rate all 12 to see them ('+rated.length+' / 12 done).';return}
  rated.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});var low=rated.slice(0,2);
  low.forEach(function(x){var s=document.getElementById('hm'+x[1]);if(s)s.classList.add('low')});
  var lvl=THEME_LEVEL[low[0][1]];
  el.innerHTML='<b class="l">Your two lowest</b>'+low.map(function(x){return '<span class="pill">'+THEMES[x[1]]+' · '+x[0]+'</span>'}).join('')+'<div style="margin-top:10px;font-size:14.5px"><b>Suggested 7-day action ('+lvl+'):</b> '+esc(t(ACTIONS[lvl]))+'</div>';
  store.set('heatlow',low.map(function(x){return THEMES[x[1]]+' ('+x[0]+')'}).join(', '));
}
function qscore(){var q=ACTS[13].quiz,s=0,n=0;q.forEach(function(x,i){var a=store.get('qz'+i);if(a!=null){n++;if(+a===x[2])s++}});var el=document.getElementById('qscore');if(el)el.textContent=n?('Score: '+s+' / '+q.length):'';store.set('qscore',n===q.length?(s+' / '+q.length):'')}
function pv(a){var el=document.getElementById('pv');if(!el)return;var txt=a.preview.map(function(k){return (store.get(k)||'').trim()}).filter(Boolean).join(' ');el.textContent=txt||'Your sentence appears here as you type.'}

/* ---------- plan ---------- */
function planText(){
  function v(k){return (store.get(k)||'').trim()}
  var name=v('name');
  var sec=[
   ['My performance contract',[v('dc0'),v('dc1')&&('Measure: '+v('dc1')),v('dc2')&&('Owner / review: '+v('dc2'))]],
   ['My SBI',[[v('sb1'),v('sb2'),v('sb3'),v('sb4')].filter(Boolean).join(' ')]],
   ['My SBAR',[v('sr1')&&('S: '+v('sr1')),v('sr2')&&('B: '+v('sr2')),v('sr3')&&('A: '+v('sr3')),v('sr4')&&('R: '+v('sr4'))]],
   ['My first GROW question',[ACTS[5].bank.reduce(function(acc,b,bi){b[2].forEach(function(q,qi){if(store.get('st'+bi+qi)==='1')acc.push(q)});return acc},[]).join(' · ')]],
   ['My GROW conversation',[v('gr1')&&('Goal: '+v('gr1')),v('gr2')&&('Reality: '+v('gr2')),v('gr3')&&('Options: '+v('gr3')),v('gr4')&&('Will: '+v('gr4'))]],
   ['Engagement — lowest themes',[v('heatlow'),v('ha')&&('7-day action: '+v('ha'))]],
   ['My positive SBI',[[v('ps1'),v('ps2'),v('ps3')].filter(Boolean).join(' ')]],
   ['30 / 60 / 90',[v('su1')&&('Day 30: '+v('su1')),v('su2')&&('Day 60: '+v('su2')),v('su3')&&('Day 90: '+v('su3'))]],
   ['Action plan',[v('ap0')&&('START: '+v('ap0')),v('ap1')&&('STOP: '+v('ap1')),v('ap2')&&('Reminder: '+v('ap2'))]],
   ['Confidence (1–5)',[ACTS[12].conf.map(function(c,i){var x=v('cf'+i);return x?(t(c)+': '+x):''}).filter(Boolean).join('\n')]],
   ['Knowledge check',[v('qscore')]]
  ];
  return {name:name,sec:sec.map(function(s){return [s[0],s[1].filter(Boolean).join('\n')]})};
}
function plan(){
  var p=planText();
  var h=header('Day 2 · '+(ED==='adm'?'Administrative':'Medical'),'My plan',true);
  h+='<div class="ahead"><div class="chip">Everything you wrote today</div><h2>'+(p.name?esc(p.name)+'’s plan':'My plan')+'</h2><div class="ar">خطتي</div></div>';
  h+='<div class="card why"><b>Share it</b>Send it to the facilitator — it’s used for your Day 30 and Day 60 check-ins. Keep a copy for yourself.</div><div class="plan">';
  p.sec.forEach(function(s){h+='<h3>'+esc(s[0])+'</h3><div class="pb'+(s[1]?'':' empty')+'">'+(s[1]?esc(s[1]):'Not filled yet')+'</div>'});
  var txt=fullText(p);
  h+='</div><div class="btns"><a class="btn wa" href="https://wa.me/?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn sec" data-copyall="1">Copy text</button></div>';
  h+='<div class="foot">Your answers stay on this phone. Nothing is sent unless you share it.</div>';
  app.innerHTML=h;
  nav.innerHTML='<div class="in"><button data-go="">‹ All activities</button></div>';
}
function fullText(p){return 'Baheya Leadership · Day 2 — '+(p.name||'My plan')+' ('+(ED==='adm'?'Admin':'Medical')+')\n\n'+p.sec.filter(function(s){return s[1]}).map(function(s){return '▪ '+s[0]+'\n'+s[1]}).join('\n\n')}

/* ---------- routing & events ---------- */
function route(){stopTimer();var h=(location.hash||'').slice(1);var a=ACTS.filter(function(x){return x.id===h})[0];
  if(a)activity(a);else if(h==='plan')plan();else home();window.scrollTo(0,0)}
function go(id){if(('#'+id)===location.hash||(!id&&!location.hash))route();else location.hash=id}
addEventListener('hashchange',route);
function copy(txt){function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'Copied':'Copy not allowed here — select the text instead')}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Copied')},fb);return}}catch(e){}fb()}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-ed],[data-ck],[data-rv],[data-sc] button,[data-o],[data-done],[data-tg],[data-rd],[data-tm],[data-copy],[data-copyall]');if(!el)return;
  if(el.hasAttribute('data-go')){go(el.getAttribute('data-go'));return}
  if(el.hasAttribute('data-ed')){setEd(el.getAttribute('data-ed'));return}
  if(el.hasAttribute('data-ck')){var k=el.getAttribute('data-ck');var on=!el.classList.contains('on');el.classList.toggle('on',on);store.set(k,on?'1':'0');return}
  if(el.hasAttribute('data-rv')){el.classList.toggle('show');return}
  if(el.parentNode&&el.parentNode.hasAttribute&&el.parentNode.hasAttribute('data-sc')){var sc=el.parentNode;sc.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});el.classList.add('on');store.set(sc.getAttribute('data-sc'),el.textContent);heatResult();return}
  if(el.hasAttribute('data-o')){var qq=el.closest('[data-qz]');var qi=+qq.getAttribute('data-qz');var q=ACTS[13].quiz[qi];store.set('qz'+qi,el.getAttribute('data-o'));
    qq.querySelectorAll('.opt').forEach(function(o,oi){o.classList.remove('ok','no');if(oi===q[2])o.classList.add('ok')});if(+el.getAttribute('data-o')!==q[2])el.classList.add('no');qq.classList.add('answered');qscore();return}
  if(el.hasAttribute('data-done')){var id=el.getAttribute('data-done');var d=store.get('done-'+id)==='1';store.set('done-'+id,d?'0':'1');el.className='btn '+(d?'pri':'done');el.textContent=d?'Mark as done':'✓ Done';if(!d)toast('Nice — saved on your phone');return}
  if(el.hasAttribute('data-tg')){document.getElementById(el.getAttribute('data-tg')).classList.toggle('on');return}
  if(el.hasAttribute('data-rd')){store.set('round',el.getAttribute('data-rd'));route();return}
  if(el.hasAttribute('data-tm')){var secs=+el.getAttribute('data-tm'),left=secs,sp=document.getElementById('tm');stopTimer();sp.classList.remove('end');
    function dr(){sp.textContent=Math.floor(left/60)+':'+(left%60<10?'0':'')+(left%60)}dr();
    tId=setInterval(function(){left--;if(left<=0){left=0;stopTimer();sp.classList.add('end');toast(secs===15?'Time! Was it under 15 seconds?':'Time — rotate roles!')}dr()},1000);return}
  if(el.hasAttribute('data-copy')){var pe=document.getElementById(el.getAttribute('data-copy'));copy(pe?pe.textContent:'');return}
  if(el.hasAttribute('data-copyall')){copy(fullText(planText()));return}
});
document.addEventListener('input',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;store.set(k,e.target.value);
  var a=ACTS.filter(function(x){return x.id===(location.hash||'').slice(1)})[0];if(a&&a.preview)pv(a)});
document.body.classList.toggle('adm',ED==='adm');
route();
})();
</script>
</body>
</html>
